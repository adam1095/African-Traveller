<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact - African Traveller</title>
  <link rel="stylesheet" href="style.css">
  <style>
    form { max-width: 400px; margin: 0 auto; text-align: left; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, select, textarea {
      width: 100%; padding: 10px; margin-top: 5px;
      border: 1px solid #aaa; border-radius: 5px; font-size: 16px;
    }
    button {
      margin-top: 20px; width: 100%; padding: 12px;
      background: #e67e22; color: white; border: none;
      border-radius: 25px; font-size: 16px; font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="nav">
    <a href="index.html">Home</a>
    <a href="tours.html">Tours</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </div>

  <div class="section">
    <h2>Book Your Trip</h2>
    <p style="margin-bottom:20px;">Fill in the form and we will reply on WhatsApp.</p>

    <form id="bookingForm">
      <label>Your name</label>
      <input type="text" id="name" required>

      <label>Choose a tour</label>
      <select id="tour">
        <option>Lake Malawi Getaway</option>
        <option>Safari Adventure</option>
        <option>Mountain Hike</option>
      </select>

      <label>Message</label>
      <textarea id="message" rows="4"></textarea>

      <button type="submit">Send on WhatsApp</button>
    </form>

    <div class="card"><h3>Phone</h3><p style="white-space:nowrap;"><a href="tel:+265889763346" style="color:#333;text-decoration:none;">+265 889 763 346</a></p></div>
